name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o shark-boost.zip -d app

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build web app
        working-directory: app
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps @capacitor/cli@^8 @capacitor/android@^8
          npm run build
          npx cap sync android
          sed -i "s/gradle:8.7.2/gradle:8.13.0/" android/build.gradle
          sed -i "s/compileSdk 35/compileSdk 36/" android/app/build.gradle

      - name: Build debug APK
        working-directory: app/android
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: shark-boost-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
